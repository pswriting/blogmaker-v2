<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlogMaker 이미지 테스트</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    margin: 0; padding: 24px; background: #f7f8fa; color: #1a1a1a; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .sub { color: #777; font-size: 13px; margin-bottom: 18px; }
  .box { background: #fff; border: 1px solid #e6e8eb; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 11px 13px; border: 1px solid #d4d7db; border-radius: 8px; font-size: 15px; }
  button { background: #03c75a; color: #fff; border: none; border-radius: 8px; padding: 11px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #c9ccd1; }
  .chips { margin-top: 12px; }
  .chip { display: inline-block; background: #eef0f2; border: 1px solid #dde; border-radius: 16px;
    padding: 5px 12px; font-size: 12px; margin: 3px 4px 3px 0; cursor: pointer; }
  .chip:hover { background: #e0f5ea; }
  .status { padding: 9px 13px; border-radius: 8px; font-size: 13px; margin: 12px 0; }
  .status.ok { background: #e6f7ee; color: #0a7a40; }
  .status.warn { background: #fff4e5; color: #b35900; }
  .status.err { background: #fdecec; color: #c0392b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .photo { border: 1px solid #e6e8eb; border-radius: 10px; overflow: hidden; background: #fff; }
  .photo img { width: 100%; height: 170px; object-fit: cover; display: block; background: #eee; }
  .photo .meta { padding: 8px 10px; font-size: 11px; color: #888; }
  .photo .first { background: #03c75a; color: #fff; font-size: 11px; padding: 3px 8px; }
</style>
</head>
<body>
<h1>🖼 BlogMaker 이미지 테스트</h1>
<div class="sub">이 페이지는 <b>실제 브라우저</b>에서 Openverse 무료 사진 API를 직접 호출해요. 검색어를 넣으면 실제로 어떤 사진이 본문에 들어갈지 미리 볼 수 있어요. (초록 배지 = 앱이 실제로 고를 첫 번째 사진)</div>

<div class="box">
  <label>검색어 (영문 권장)</label>
  <input type="text" id="q" placeholder="예: korean cafe interior" value="korean cafe interior">
  <div class="chips" id="chips"></div>
  <button id="searchBtn">🔍 사진 검색</button>
</div>

<div id="status"></div>
<div class="grid" id="grid"></div>

<script>
const ENDPOINTS = [
  "https://api.openverse.org/v1/images/",
  "https://api.openverse.engineering/v1/images/",
];

// 카테고리별 예시 검색어 (Streamlit 앱 skills와 동일)
const SAMPLES = [
  "korean cafe interior", "delicious korean food", "cafe latte art",
  "smartphone close up", "tech gadget desk setup", "laptop on desk",
  "korean won bills", "calculator and paperwork", "financial planning notebook",
  "peaceful meditation", "morning sunlight window", "healthy breakfast bowl",
  "study desk with notebook", "business meeting handshake", "resume on desk",
  "government office building", "modern kitchen appliance", "living room cozy",
  "data analytics chart", "small business creative work",
];

const chipsEl = document.getElementById("chips");
SAMPLES.forEach(s => {
  const c = document.createElement("span");
  c.className = "chip"; c.textContent = s;
  c.onclick = () => { document.getElementById("q").value = s; search(); };
  chipsEl.appendChild(c);
});

const btn = document.getElementById("searchBtn");
const statusEl = document.getElementById("status");
const grid = document.getElementById("grid");
btn.onclick = search;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  btn.disabled = true; btn.textContent = "⏳ 검색 중...";
  grid.innerHTML = "";
  statusEl.className = "status warn";
  statusEl.textContent = "🔍 Openverse에서 '" + q + "' 검색 중...";

  let lastErr = "";
  for (const ep of ENDPOINTS) {
    try {
      const url = ep + "?q=" + encodeURIComponent(q) + "&page_size=8&mature=false";
      const r = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!r.ok) { lastErr = "HTTP " + r.status + " (" + ep + ")"; continue; }
      const data = await r.json();
      const results = data.results || [];
      if (!results.length) { lastErr = "검색 결과 0개"; continue; }
      render(results, q, data.result_count);
      return;
    } catch (e) {
      lastErr = (e.message || e) + " (" + ep + ")";
    }
  }
  statusEl.className = "status err";
  statusEl.textContent = "❌ 실패: " + lastErr +
    " — 브라우저에서 직접 열었는지 확인하세요. (file:// 로 열면 CORS로 막힐 수 있어요. 그럴 땐 Streamlit 앱에서 테스트하세요.)";
  btn.disabled = false; btn.textContent = "🔍 사진 검색";
}

function render(results, q, total) {
  statusEl.className = "status ok";
  statusEl.textContent = "✅ '" + q + "' — 총 " + (total || results.length) + "개 중 " + results.length + "개 표시. 맨 앞(초록 배지)이 본문에 들어갈 사진이에요.";
  grid.innerHTML = "";
  results.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "photo";
    const imgUrl = p.thumbnail || p.url;
    div.innerHTML =
      (i === 0 ? '<div class="first">⭐ 앱이 선택할 사진</div>' : '') +
      '<img loading="lazy" src="' + imgUrl + '" alt="" onerror="this.style.opacity=0.3;this.alt=\'(로드 실패)\'">' +
      '<div class="meta">by ' + (p.creator || "Unknown") + ' · ' + (p.source || "") + ' · ' + (p.license || "cc").toUpperCase() + '</div>';
    grid.appendChild(div);
  });
  btn.disabled = false; btn.textContent = "🔍 사진 검색";
}

// 첫 로드 시 자동 검색
search();
</script>
</body>
</html>
